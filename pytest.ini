[pytest]
# Default collection is scoped to the canonical tests/ suite. The
# experimental/ tree is non-canonical (see experimental/README.md) and its
# test modules import from experimental/qiyas_core/, which is intentionally
# not on PYTHONPATH for canonical runs. To run experimental tests explicitly:
#   PYTHONPATH=src:experimental python3 -m pytest experimental/tests
testpaths = tests

markers =
    kernel: QiyasKernel execution tests
    rule: QiyasRule validation tests
    adapter: Adapter contract tests
    constitution: Constitutional invariant tests
    slot_geometry: SlotGeometry protocol tests
    golden: Golden path tests
    integration: Cross-layer integration tests
    regression: Regression tests for fixed bugs
    rank: Evidence rank invariant tests
    identity_trace: Identity and trace invariant tests
    evidence_claims: Evidence claim grammar tests
    no_higher_outputs: Candidate boundary tests

addopts = --strict-markers -v
